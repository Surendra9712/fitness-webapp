<svg viewBox="0 0 560 160" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A93B"/>
      <stop offset="100%" stop-color="#F7C873"/>
    </linearGradient>
  </defs>

  <!-- Icon mark: macro-balance ring with a smart-spark accent -->
  <g transform="translate(10,10)">
    <circle cx="60" cy="60" r="42" fill="none" stroke="#E7EEEC" stroke-width="14"/>

    <path d="M 54.15 18.41 A 42 42 0 0 1 76.00 98.83"
          fill="none" stroke="#0F5257" stroke-width="14" stroke-linecap="round"/>

    <path d="M 72.56 100.08 A 42 42 0 0 1 18.10 62.86"
          fill="none" stroke="#54B399" stroke-width="14" stroke-linecap="round"/>

    <path d="M 18.01 59.19 A 42 42 0 0 1 50.55 19.08"
          fill="none" stroke="#F2A93B" stroke-width="14" stroke-linecap="round"/>

    <!-- Smart spark: the AI/precision accent sitting at the ring's gap -->
    <circle cx="50.5" cy="19" r="7.5" fill="url(#sparkGrad)"/>
    <path d="M 50.5 14.2 L 52.1 18.3 L 56.3 19.9 L 52.1 21.5 L 50.5 25.6 L 48.9 21.5 L 44.7 19.9 L 48.9 18.3 Z"
          fill="#ffffff"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(140,0)">
    <text x="0" y="72" font-size="40" font-weight="600" letter-spacing="0.3" fill="#1B2B2A">smart</text>
    <text x="140" y="72" font-size="40" font-weight="300" letter-spacing="0.3" fill="#1B2B2A">diet</text>

    <!-- PRO badge -->
    <rect x="232" y="42" width="66" height="30" rx="15" fill="#0F5257"/>
    <text x="265" y="63" font-size="17" font-weight="600" letter-spacing="1.5" fill="#ffffff" text-anchor="middle">PRO</text>

    <text x="0" y="96" font-size="12.5" font-weight="400" letter-spacing="2.5" fill="#6B8C87">EAT SMARTER, TRACK SHARPER</text>
  </g>
</svg>
